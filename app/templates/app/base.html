{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}APKShield{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: { background:"#0a0a0a", card:"#0d0d0f", border:"#1f1f23",
          accent:"#22c55e", danger:"#ef4444", warning:"#f59e0b", safe:"#22c55e" },
        fontFamily: { sans:["Outfit","system-ui"], mono:["JetBrains Mono","monospace"] },
      }},
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  {% block head %}{% endblock %}
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased min-h-screen">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
