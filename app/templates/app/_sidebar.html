<aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-64 shrink-0 bg-[#0d0d0f] border-r border-[#1f1f23] flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-300">
  <div class="h-16 px-4 flex items-center gap-3 border-b border-[#1f1f23] shrink-0">
    <div class="w-9 h-9 rounded-xl bg-[#22c55e] flex items-center justify-center shrink-0 shadow-[0_0_20px_-4px_rgba(34,197,94,0.5)]">
      <i class="fa-solid fa-shield-halved text-black text-sm"></i>
    </div>
    <div class="min-w-0">
      <h1 class="font-bold leading-tight text-[15px]">APKShield</h1>
      <p class="text-[10px] text-[#71717a] leading-tight uppercase tracking-[0.1em]">Malware Detection</p>
    </div>
  </div>

  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm {% if active == 'dashboard' %}bg-[#22c55e]/10 text-[#22c55e] border border-[#22c55e]/20{% else %}text-[#a1a1aa] hover:text-white hover:bg-white/[0.03] border border-transparent{% endif %} transition">
      <i class="fa-solid fa-satellite-dish w-4 text-center text-xs"></i><span>New Scan</span>
    </a>
    <a href="{% url 'history' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm {% if active == 'history' %}bg-[#22c55e]/10 text-[#22c55e] border border-[#22c55e]/20{% else %}text-[#a1a1aa] hover:text-white hover:bg-white/[0.03] border border-transparent{% endif %} transition">
      <i class="fa-solid fa-clock-rotate-left w-4 text-center text-xs"></i><span>History</span>
    </a>
    <a href="{% url 'threats' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm {% if active == 'threats' %}bg-[#22c55e]/10 text-[#22c55e] border border-[#22c55e]/20{% else %}text-[#a1a1aa] hover:text-white hover:bg-white/[0.03] border border-transparent{% endif %} transition">
      <i class="fa-solid fa-database w-4 text-center text-xs"></i><span>Detected Threats</span>
    </a>
    <a href="{% url 'report' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm {% if active == 'report' %}bg-[#22c55e]/10 text-[#22c55e] border border-[#22c55e]/20{% else %}text-[#a1a1aa] hover:text-white hover:bg-white/[0.03] border border-transparent{% endif %} transition">
      <i class="fa-solid fa-file-shield w-4 text-center text-xs"></i><span>Reports</span>
    </a>
    <a href="{% url 'settings' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm {% if active == 'settings' %}bg-[#22c55e]/10 text-[#22c55e] border border-[#22c55e]/20{% else %}text-[#a1a1aa] hover:text-white hover:bg-white/[0.03] border border-transparent{% endif %} transition">
      <i class="fa-solid fa-gear w-4 text-center text-xs"></i><span>Settings</span>
    </a>
    <a href="{% url 'about' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm {% if active == 'about' %}bg-[#22c55e]/10 text-[#22c55e] border border-[#22c55e]/20{% else %}text-[#a1a1aa] hover:text-white hover:bg-white/[0.03] border border-transparent{% endif %} transition">
      <i class="fa-solid fa-circle-info w-4 text-center text-xs"></i><span>About</span>
    </a>
  </nav>

  <div class="p-3 border-t border-[#1f1f23] shrink-0 space-y-2">
    <div class="flex items-center gap-3 p-2.5 rounded-xl bg-black/40 border border-[#1f1f23]">
      <div class="w-8 h-8 rounded-full bg-[#22c55e]/15 border border-[#22c55e]/20 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-user text-[#22c55e] text-[11px]"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-xs font-semibold truncate">{{ request.user.username }}</p>
        <p class="text-[10px] text-[#71717a] truncate">{{ request.user.email|default:"guest@apkshield.io" }}</p>
      </div>
      <a href="{% url 'logout' %}" class="text-[#71717a] hover:text-[#ef4444] transition" title="Sign out">
        <i class="fa-solid fa-right-from-bracket text-[11px]"></i>
      </a>
    </div>
    <div class="flex items-center justify-between px-1 text-[10px] font-mono text-[#52525b]">
      <span>v2.3.1</span>
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#22c55e] dot-pulse"></span>Engine Online
      </span>
    </div>
  </div>
</aside>
